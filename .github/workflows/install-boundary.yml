name: install-boundary

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  install-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      # uvx runs the pinned Skill Eval Harness (manifest gate and the model-free grading test).
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Check installable skill boundary
        run: python3 scripts/check_install_boundary.py
      - name: Check SKILL.md line budget
        run: python3 scripts/check_skill_budget.py
      # Model-free and key-free: manifest shape, regex compilation, prompt leakage,
      # ablation targets, and audit blockers, with the harness version pinned.
      - name: Validate shared benchmark manifest (skill-eval-harness 0.6.0)
        run: uvx --from skill-eval-harness==0.6.0 skill-benchmark validate --strict-leakage --check-ablations evals/shared-benchmark.json
      - name: Audit shared benchmark manifest
        run: uvx --from skill-eval-harness==0.6.0 skill-benchmark audit-manifest evals/shared-benchmark.json --fail-on-blockers
      - name: Unit tests for repo scripts and eval oracles
        run: python3 -m unittest discover -s tests -v
